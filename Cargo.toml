[package]
name = "carteiro"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Recebe e-mail por SMTP e entrega na caixa do Gmail pela Gmail API"
license = "MIT"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
mail-auth = { version = "0.15.1", default-features = false, features = ["rust-crypto", "dns-hickory"] }
memmap2 = "0.9.12"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "form"] }
ring = "0.17.14"
rustls-pki-types = { version = "1.16.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "macros", "time", "fs", "sync", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "1.2.1"
webpki-roots = "1.0.12"

[dev-dependencies]
axum = "0.8.9"
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
